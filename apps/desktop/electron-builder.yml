appId: com.allcon.studio
productName: All Con Studio
executableName: AllConStudio

directories:
  output: release

# Default database (not created by the installer): %APPDATA%\All Con Studio\all-con-studio.db
publish:
  provider: github
  owner: joshuasoudah
  repo: All-Con-Studio

files:
  - dist-renderer/**
  - dist-desktop/**
  - dist-migrations/**
  - node_modules/**
  - package.json

# sqlite3 ships a compiled .node binary; native addons can't be dlopen'd from inside app.asar
asarUnpack:
  - '**/node_modules/sqlite3/**/*'
  - '**/node_modules/bindings/**/*'

extraMetadata:
  main: dist-desktop/main/main.cjs

forceCodeSigning: false

afterPack: scripts/after-pack.cjs

toolsets:
  appimage: 1.0.3

win:
  icon: apps/desktop/main/assets/icon.ico
  target:
    - target: nsis
      arch:
        - x64

nsis:
  artifactName: All-Con-Studio-Setup-${version}.${ext}
  shortcutName: All Con Studio
  uninstallDisplayName: All Con Studio
  oneClick: false
  perMachine: false
  allowElevation: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  menuCategory: All Con Studio
  installerIcon: apps/desktop/main/assets/icon.ico
  uninstallerIcon: apps/desktop/main/assets/icon.ico

linux:
  target:
    - deb
    - AppImage
  category: Office
  maintainer: 'Piratuks <evaldiz@gmail.com>'
  icon: 'apps/desktop/main/assets/linux-icons'

appImage:
  artifactName: Invoice-Builder-${version}.${ext}

mac:
  target:
    - dmg
  category: public.app-category.productivity
  icon: 'apps/desktop/main/assets/macos-icons/icon.icns'

dmg:
  artifactName: Invoice-Builder-${version}-${arch}.${ext}
  contents:
    - type: file
      x: 130
      y: 220
    - type: link
      x: 410
      y: 220
      path: /Applications
